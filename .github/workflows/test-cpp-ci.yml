name: Test Single-Package CI Workflow
description: >
  Test the C++ develop workflow using a checked out repository

on:
  workflow_dispatch:
    inputs:
      caller_event_name:
        default: 'schedule'
        type: string
        description: "Flag to distinguish between e.g. schedule and pull request"
      target_branch:
        type: string
        default: 'develop'
        description: "Branch this change targets (e.g. develop). Affects the release image and whether matching feature branches are cloned. Leave blank to use the current branch."
      caller_branch:
        type: string
        default: 'develop'
        description: "Override the caller's branch for testing purposes (not to be used in scheduled/PR runs)"
      repository:
        type: string
        default: 'DUNE-DAQ/hdf5libs'
        description: "Optionally specify owner/repository for testing purposes (not to be used in scheduled/PR runs)"

jobs:
  test:
    uses: ./.github/workflows/dunedaq-develop-cpp-ci.yml
    with:
      caller_event_name:        ${{ inputs.caller_event_name }}
      target_branch:            ${{ inputs.target_branch}}
      repository:               ${{ inputs.repository }}
