name: Single-Package CI Build and Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      caller_event_name:
        default: 'schedule'
        type: string
        description: "Flag to distinguish between e.g. schedule and pull request"
      caller_branch:
        type: string
        default: 'develop'
        description: "Override the caller's branch for testing purposes (not to be used in scheduled/PR runs)"
      target_branch:
        type: string
        default: 'develop'
        description: "Branch this change targets (e.g. develop). Affects the release image and whether matching feature branches are cloned. Leave blank to use the current branch."
      repository:
        type: string
        default: 'DUNE-DAQ/hdf5libs'
        description: "Optionally specify owner/repository for testing purposes (not to be used in scheduled/PR runs)"
  workflow_call:
    inputs:
      caller_event_name:
        required: true
        type: string
        description: "Flag to distinguish between e.g. schedule and pull request"
      caller_branch:
        type: string
        default: ''
        description: "Override the caller's branch for testing purposes (not to be used in scheduled/PR runs)"
      target_branch:
        type: string
        default: ''
        description: "Branch this change targets (e.g. develop). Affects the release image and whether matching feature branches are cloned. Leave blank to use the current branch."
      repository:
        type: string
        default: ${{ github.repository }}
        description: "Optionally specify a repository for testing purposes (not to be used in scheduled/PR runs)"

env:
  CALLER_BRANCH: ${{ inputs.caller_branch || github.head_ref || github.ref_name }}
  TARGET_BRANCH: ${{ inputs.target_branch || github.base_ref || github.ref_name }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      repo_name: ${{ steps.set_repo_name.outputs.repo_name }}
      image: ${{ steps.get_release_info.outputs.image }}
      dbt_args: ${{ steps.get_release_info.outputs.dbt_args }}
      release_area: ${{ steps.get_release_info.outputs.release_area }}
    steps:
      - id: set_repo_name
        run: |
          # e.g., "DUNE-DAQ/hdf5libs" -> "hdf5libs"
          REPOSITORY=${{ inputs.repository }}
          echo "repo_name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: checkout package for CI
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          path:       ${{ steps.set_repo_name.outputs.repo_name }}
          ref:        ${{ env.TARGET_BRANCH }}

      - id: check
        run: |
          if [[ "$CALLER_BRANCH" != "$TARGET_BRANCH" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else

            cd $GITHUB_WORKSPACE/${{ steps.set_repo_name.outputs.repo_name }}
            commit_time=$( git log -1 --format=%ct )
            current_time=$( date +%s )

            time_since_last_commit=$(( current_time - commit_time ))
            max_time_since_push=90

            if (( $time_since_last_commit > $max_time_since_push )); then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "Single repo CI will not proceed as this appears to be triggered by a merge or a push (last commit to $TARGET_BRANCH was $time_since_last_commit seconds ago)"
              exit 0
            fi
          fi

      - id: get_release_info
        run: |
          case "$TARGET_BRANCH" in
            prep-release/*)
              image="ghcr.io/dune-daq/candidate-release-alma9:latest"
              dbt_args="-b candidate"
              release_area=/cvmfs/dunedaq-development.opensciencegrid.org/candidates/ ;;
            patch/*)
              image="ghcr.io/dune-daq/stable-release-alma9:latest"
              dbt_args=""
              release_area=/cvmfs/dunedaq.opensciencegrid.org/spack/releases/ ;;
            *)
              image="ghcr.io/dune-daq/nightly-release-alma9:development_v5"
              dbt_args="-n"
              release_area=/cvmfs/dunedaq-development.opensciencegrid.org/nightly/ ;;
          esac
          {
            echo "image=$image"
            echo "dbt_args=$dbt_args"
            echo "release_area=$release_area"
          } >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"

  create_build_area:
    needs: setup
    if: ${{ needs.setup.outputs.should_run == 'true' }}
    name: create_dev_area_on_${{ matrix.os_name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os_name: "a9"
    env:
      REPO: ${{ needs.setup.outputs.repo_name }}
      DBT_ARGS: ${{ needs.setup.outputs.dbt_args }}
      IMAGE: ${{ needs.setup.outputs.image }}
      RELEASE_AREA: ${{ needs.setup.outputs.release_area }}

    steps:
    - name: Checkout daq-release
      uses: actions/checkout@v7
      with:
        repository: DUNE-DAQ/daq-release
        path: daq-release

    - name: checkout package for CI
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        path:       ${{ env.REPO }}
        ref:        ${{ env.CALLER_BRANCH }}

    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8
      with:
        cvmfs_repositories: 'dunedaq-development.opensciencegrid.org'

    - name: Generate dbt wrapper script
      run: |
        cat << 'EOF' > dbt_wrapper.sh
        #!/bin/bash
        set -eo pipefail
        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest
        cd dev-${{ matrix.os_name }}
        source env.sh
        if [[ -d "sourcecode/dbe" ]]; then
          spack load dbe
        fi
        exec "$@"
        EOF
        
        chmod +x dbt_wrapper.sh
        cat dbt_wrapper.sh

    - name: setup build area
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << EOF > setup_build_area.sh
        #!/bin/bash
        set -eo pipefail
        source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
        setup_dbt latest
        RELEASE_NAME="$( ls -tr $RELEASE_AREA | grep fddaq | tail -1 )"

        dbt-create $DBT_ARGS \
                   $RELEASE_NAME \
                   dev-${{ matrix.os_name }} || exit 11
        cd dev-${{ matrix.os_name }}
        source env.sh
        cd sourcecode
        if [[ "$CALLER_BRANCH" == "$TARGET_BRANCH" ]]; then
          cp -pr /ghw/$REPO .
        else   # Someone opened a PR
          export GITHUB_TOKEN=$GITHUB_TOKEN
          /ghw/daq-release/scripts/clone_all_packages_with_branch.py --branch $CALLER_BRANCH --package-group coredaq
          /ghw/daq-release/scripts/clone_all_packages_with_branch.py --branch $CALLER_BRANCH --package-group fddaq
        fi

        if [[ -d "./dbe" ]]; then
          spack load dbe
        fi

        dbt-workarea-env
        dbt-build
        EOF

        chmod +x setup_build_area.sh
        cat setup_build_area.sh

        docker run --rm \
          -v /cvmfs:/cvmfs:shared \
          -v "${GITHUB_WORKSPACE}:/ghw" \
          -w /ghw \
          $IMAGE \
          /ghw/setup_build_area.sh
          #--user $(id -u):$(id -g) \

    - name: upload build log file
      uses: actions/upload-artifact@v7
      with:
        name: build_log_${{ matrix.os_name }}
        path: ${{ github.workspace }}/dev-${{ matrix.os_name }}/log/build*.log

    - name: Create work area tarball
      run: |
        tar --zstd -cf dev-${{matrix.os_name }}.tar.zst dev-${{ matrix.os_name }} dbt_wrapper.sh daq-release

    - name: Upload work area tarball as artifact
      uses: actions/upload-artifact@v7
      with:
        name: build_area_${{ matrix.os_name }}
        path: dev-${{ matrix.os_name }}.tar.zst
        # Default compression level is 6, which is redundant since we already compressed with zstd
        compression-level: 0
        retention-days: 7

  unit_tests:
    needs: [setup, create_build_area]
    name: run_unit_tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os_name: "a9"
    env:
      REPO: ${{ needs.setup.outputs.repo_name }}
      IMAGE: ${{ needs.setup.outputs.image }}

    steps:
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8
      with:
        cvmfs_repositories: 'dunedaq-development.opensciencegrid.org'

    - name: Download work area artifact
      uses: actions/download-artifact@v8
      with:
        name: build_area_${{ matrix.os_name }}

    - name: Unpack work area
      run: |
        tar --zstd -xf dev-${{matrix.os_name }}.tar.zst

    - name: Pull docker image
      run: |
        docker pull $IMAGE

    - name: Run unit tests
      run: |
        docker run --rm \
          -v /cvmfs:/cvmfs:shared \
          -v "${GITHUB_WORKSPACE}:/ghw" \
          -w /ghw \
          $IMAGE \
          /ghw/dbt_wrapper.sh dbt-build --unittest
          #--user $(id -u):$(id -g) \

    - name: Get unit test summary path
      id: unit_test_summary
      run: |
        summary_file_path=$(find . -name unit_test_summary.log -type f)
        ./daq-release/scripts/github-ci/parse_unit_test_summary.sh $summary_file_path | tee $GITHUB_STEP_SUMMARY
        echo "summary_file_path=$summary_file_path" >> "$GITHUB_OUTPUT"

    - name: upload unit test summary file
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: unit_test_summary
        path: ${{ steps.unit_test_summary.outputs.summary_file_path }}

  clang_formatting:
    needs: [setup, create_build_area]
    name: run_clang_formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os_name: "a9"
    env:
      REPO: ${{ needs.setup.outputs.repo_name }}
      IMAGE: ${{ needs.setup.outputs.image }}

    steps:
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8
      with:
        cvmfs_repositories: 'dunedaq-development.opensciencegrid.org'

    - name: Download work area artifact
      uses: actions/download-artifact@v8
      with:
        name: build_area_${{ matrix.os_name }}

    - name: Unpack work area
      run: |
        tar --zstd -xf dev-${{matrix.os_name }}.tar.zst

    - name: Pull docker image
      run: |
        docker pull $IMAGE

    - name: Run clang formatting
      run: |
        docker run --rm \
          -v /cvmfs:/cvmfs:shared \
          -v "${GITHUB_WORKSPACE}:/ghw" \
          -w /ghw \
          $IMAGE \
          /ghw/dbt_wrapper.sh dbt-clang-format.sh sourcecode/$REPO --view-differences-only --markdown-summary
          #--user $(id -u):$(id -g) \

    - name: Get clang format summary path
      id: clang_format_summary
      run: |
        file_path=$(find . -name clang_format_summary_table.md -type f)
        cat "$file_path" >> $GITHUB_STEP_SUMMARY
        echo "file_path=$file_path" >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
  
    - name: upload clang format summary file
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: clang_format_summary
        path: ${{ steps.clang_format_summary.outputs.file_path }}

  linting:
    needs: [setup, create_build_area]
    name: run_linting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os_name: "a9"
    env:
      REPO: ${{ needs.setup.outputs.repo_name }}
      IMAGE: ${{ needs.setup.outputs.image }}

    steps:
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8
      with:
        cvmfs_repositories: 'dunedaq-development.opensciencegrid.org'

    - name: Download work area artifact
      uses: actions/download-artifact@v8
      with:
        name: build_area_${{ matrix.os_name }}

    - name: Unpack work area
      run: |
        tar --zstd -xf dev-${{matrix.os_name }}.tar.zst

    - name: Pull docker image
      run: |
        docker pull $IMAGE

    - name: Run linting
      run: |
        docker run --rm \
          -v /cvmfs:/cvmfs:shared \
          -v "${GITHUB_WORKSPACE}:/ghw" \
          -w /ghw \
          $IMAGE \
          /ghw/dbt_wrapper.sh dbt-build --lint $REPO
          #--user $(id -u):$(id -g) \

    - name: set linting artifact name
      id: set_artifact_name
      run: |
        linting_artifact_name="pull_request_linting_results"
        if [[ "${{ inputs.caller_event_name }}" == "schedule" ]]; then
          linting_artifact_name="nightly_linting_results"
        fi

        linting_file_path=$(find ${{ github.workspace }}/dev-${{ matrix.os_name }}/log/ -name ${REPO}_linting.log | tail -n 1)
        if [[ ! -f "$linting_file_path" ]]; then
          echo "No file named ${REPO}_linting.log found"
          exit 15
        fi

        echo "linting_artifact_name=$linting_artifact_name" >> "$GITHUB_OUTPUT"
        echo "linting_file_path=$linting_file_path" >> "$GITHUB_OUTPUT"
        
        cat "$GITHUB_OUTPUT"

    - name: upload linting log file
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.set_artifact_name.outputs.linting_artifact_name }}
        path: ${{ steps.set_artifact_name.outputs.linting_file_path }}


  compare_linting_results:
    if: ${{ inputs.caller_event_name == 'pull_request' }}
    needs: [setup, create_build_area, linting]
    runs-on: ubuntu-latest
    env:
      REPO: ${{ needs.setup.outputs.repo_name }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Get ID of latest nightly run
      id: latest_nightly
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list \
          --repo ${{ inputs.repository }} \
          --workflow dunedaq-develop-cpp-ci.yml \
          --event schedule \
          --limit 10 \
          --json databaseId,conclusion \
          --jq '[.[] | select(.conclusion=="success")] | first | .databaseId')

        echo "Comparing results to those from run_id=$run_id"
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Download latest nightly linting results
      uses: actions/download-artifact@v8
      with:
        github-token: ${{ github.token }}
        repository: ${{ inputs.repository }}
        name: nightly_linting_results
        path: nightly_linting
        run-id: ${{ steps.latest_nightly.outputs.run_id }}

    - name: Download pull request linting results
      uses: actions/download-artifact@v8
      with:
        name: pull_request_linting_results
        path: pull_request_linting

    - name: Compare linting results
      id: compare
      run: |
        normalize_lint() {
          sed -E '
            s#^/[^ ]*/(sourcecode/.*)#\1#;     # drop leading absolute path before sourcecode/
            s#:[0-9]+:[0-9]+:#:#g;             # drop :line:col:
            s#:[0-9]+:#:#g;                    # drop :line:
            /^[ ]*[0-9]+[ ]\|/d;               # Remove lines starting with " line | "
            /^Total errors found:/d;           # drop summary
          ' "$1" |
          { grep -E "(^|/)${REPO}(/|:)" || true; } |  # keep only lines related to this package
          { grep -E '\[[^][]+\]' || true; } |  # keep only lines with a [check]
          sort -u
        }

        diff_file_name=linting_diff.txt
        pr_linting_results_file=$(find pull_request_linting/ -name "${REPO}_linting.log" | tail -n 1)
        nightly_linting_results_file=$(find nightly_linting/ -name "${REPO}_linting.log" | tail -n 1)

        if [[ ! -f "$pr_linting_results_file" ]]; then
          echo "ERROR: No PR linting results file found"
          exit 11
        fi
        if [[ ! -f "$nightly_linting_results_file" ]]; then
          echo "ERROR: No nightly linting results file found"
          exit 12
        fi

        echo "Pull request linting file: $pr_linting_results_file"
        echo "Nightly linting file: $nightly_linting_results_file"

        nightly_norm=$(mktemp)
        pr_norm=$(mktemp)

        normalize_lint "$nightly_linting_results_file" > "$nightly_norm"
        normalize_lint "$pr_linting_results_file" > "$pr_norm"

        comm -13 "$nightly_norm" "$pr_norm" > "$diff_file_name"

        diff_exists=""
        if [[ -s "$diff_file_name" ]]; then
          echo "ERROR: This PR introduces new linting errors:"
          cat "$diff_file_name"
          echo "diff_exists=true" >> "$GITHUB_OUTPUT"
          echo "diff_file_name=$diff_file_name" >> "$GITHUB_OUTPUT"
          exit 13
        fi

        echo "diff_exists=false" >> "$GITHUB_OUTPUT"

    - name: upload linting diff file
      if: ${{ failure() && steps.compare.outputs.diff_exists == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: linting_diff
        path: ${{ steps.compare.outputs.diff_file_name }}

  check_docs_links:
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        path:       ${{ needs.setup.outputs.repo_name }}
        ref:        ${{ env.TARGET_BRANCH }}
    - name: Check links
      uses: lycheeverse/lychee-action@649b0e4890508ea3e11ea6b3ee35ce899a25afd5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        fail: false
        failIfEmpty: false
        args: >
          --exclude-path '(^|/)docs/graph/README\.md$'
          --accept 200,403
          --exclude '^https://twiki\.cern\.ch/.*'
          --exclude '^https://cernbox\.cern\.ch\.*'
          --exclude '^https://indico\..*'
          --exclude '^https://wiki\.dunescience\.org/.*'
          --exclude '^https://github\.com/DUNE-DAQ/drunc/wiki/Archive:.*'
          --github-token ${{ env.GITHUB_TOKEN }}
          .

    - name: Upload link checker log
      uses: actions/upload-artifact@v7
      with:
        name: link_checker_log
        path: ./lychee/out.md

